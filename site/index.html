<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ланчин</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #faf8f5; color: #25221f; margin: 0; }
      main { max-width: 900px; margin: 0 auto; padding: 3rem 1rem; }
      h1 { margin-top: 0; }
      /* Grid of cards: three per row (two on tablets, one on phones) */
      .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; padding: 0; margin: 0; list-style: none; }
      @media (max-width: 760px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (max-width: 480px) { .cards { grid-template-columns: minmax(0, 1fr); } }
      .cards li { margin: 0; }
      .cards a { display: block; height: 100%; box-sizing: border-box; padding: 1rem; background: #fff; border: 1px solid #e6e0d8; border-radius: 10px; color: inherit; text-decoration: none; font-weight: 600; }
      .cards a:hover { border-color: #35699f; }
      small { display: block; margin-top: 0.25rem; color: #6d675f; font-weight: 400; }
      footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #e6e0d8; color: #6d675f; font-size: 0.85rem; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <h1>Ланчин - Lanchyn - Lanczyn</h1>
      <ul class="cards">
        <!-- APP_CARDS: generated by scripts/build_site.mjs from apps/*/meta.json -->
      </ul>
      <footer>© 2026 Petro Ivaniuk. Усі права захищено.</footer>
    </main>
  </body>
</html>
